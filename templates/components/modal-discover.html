{# Discover Modal Component #}
<div class="modal fade" id="discoverModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark">
            <div class="modal-header border-secondary">
                <h5 class="modal-title"><i class="bi bi-radar me-2"></i>Network Discovery</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Scan Options -->
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Subnet</label>
                        <input type="text" class="form-control" id="scanSubnet" value="{{ network.subnet }}" placeholder="192.168.1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Start IP</label>
                        <input type="number" class="form-control" id="scanStart" value="{{ network.scan_start }}" min="1" max="254" placeholder="1">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">End IP</label>
                        <input type="number" class="form-control" id="scanEnd" value="{{ network.scan_end }}" min="1" max="254" placeholder="254">
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button class="btn btn-moonlight w-100" onclick="startDiscovery()">
                            <i class="bi bi-search"></i> Scan
                        </button>
                    </div>
                </div>

                <!-- Status Message -->
                <div id="discoveryStatus" class="alert alert-info d-none">
                    <i class="bi bi-hourglass-split pulse me-2"></i>
                    <span>Scanning network...</span>
                </div>

                <!-- Results Container -->
                <div id="discoveryResults" class="mt-3"></div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-success btn-sm" onclick="importSelected()" id="importBtn" disabled>
                    <i class="bi bi-plus-circle me-1"></i>Import Selected (<span id="selectedCount">0</span>)
                </button>
            </div>
        </div>
    </div>
</div>
