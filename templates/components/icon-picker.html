{# Icon Picker Component #}
{# Include this once in the page, then use showIconPicker() from JS #}

<div class="modal fade" id="iconPickerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title"><i class="bi bi-palette me-2"></i>Choose Icon</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Search -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="iconSearchInput" placeholder="Search icons...">
                </div>
                <!-- Icon Grid -->
                <div class="icon-picker-grid" id="iconPickerGrid">
                    <!-- Icons populated by JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.icon-picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
    gap: 4px;
    max-height: 300px;
    overflow-y: auto;
}

.icon-picker-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--md-surface-variant);
    border: 1px solid transparent;
}

.icon-picker-item:hover {
    background: var(--md-surface-elevated);
    border-color: var(--accent-color);
}

.icon-picker-item.selected {
    background: var(--accent-color);
    color: var(--accent-text-color);
}

.icon-picker-item i {
    font-size: 1.25rem;
}
</style>
